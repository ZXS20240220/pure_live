# 刷新 dev_from_v3.1.4 发布通道的 releases.json（外部定时触发）
#
# 与 update_releases.yml（master 的上游全量历史）不同，本工作流只同步
# 本 Fork 自己的 Release，并始终写入 dev_from_v3.1.4 —— 这才是
# Windows 客户端“历史版本更新记录”实际读取的分支（见
# lib/common/utils/version_util.dart 中的 branch: 'dev_from_v3.1.4'）。
#
# 触发方式：
#   本仓库是公开 Fork，GitHub 原生 schedule 在此不可靠（会被自动停用），
#   故改为纯 workflow_dispatch，由外部定时器（如 cron-job.org）调用 REST API：
#     POST /repos/{owner}/{repo}/actions/workflows/update_release.yml/dispatches
#     Body: {"ref":"dev_from_v3.1.4"}
#   job 仍显式 checkout 默认分支，避免默认分支调整后误写。
name: 定时更新历史发布记录

on:
  # 仅外部/手动触发；不再依赖 GitHub 原生 schedule（见文件头说明）。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-index-dev_from_v3.1.4
  cancel-in-progress: false

jobs:
  sync-releases:
    name: Regenerate releases.json on dev_from_v3.1.4
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 无论从哪个分支触发，都固定检出并回写 dev_from_v3.1.4，
      # 避免误改 master 的上游历史 feed。
      - name: Checkout fork release branch
        uses: actions/checkout@v7
        with:
          ref: dev_from_v3.1.4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Regenerate assets/releases.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/sync_fork_releases.py

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- assets/releases.json; then
            git add assets/releases.json
            git commit -m "chore: refresh releases.json [skip ci]"
            git pull --rebase origin dev_from_v3.1.4
            git push origin HEAD:dev_from_v3.1.4
          else
            echo "发布数据未发生变化，无需更新。"
          fi