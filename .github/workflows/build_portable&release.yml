# Fork 专用 – Windows 便携版构建与发布
# 不依赖证书 / Inno Setup / fastforge，零 Secret 配置
#
# workflow_dispatch 提供两个可独立勾选的阶段：
#   do_build       —— 跑分析/测试（可选）+ 构建 Windows 便携版并上传产物
#   create_release —— 创建 GitHub Release；若本次未构建，则自动回取本工作流
#                     最近一次成功运行上传的产物，并把 version.json /
#                     releases.json 提交回 dev_from_v3.1.4 分支
name: Build Windows Portable & Create Release
on:
  workflow_dispatch:
    inputs:
      run_quality:
        description: Run analyze and tests first
        required: true
        type: boolean
        default: false
      do_build:
        description: Build the Windows portable ZIP and upload the artifact
        required: true
        type: boolean
        default: true
      create_release:
        description: Create a GitHub Release and sync version.json / releases.json
        required: true
        type: boolean
        default: true
      prerelease:
        description: Mark as pre-release
        required: true
        type: boolean
        default: false

permissions:
  contents: read
# 发布阶段会创建 Release 并回推分支，不能被更新的一次触发中途取消，
# 否则可能留下半成品 tag / Release。
concurrency:
  group: portable-build-${{ github.ref }}
  cancel-in-progress: false
env:
  FLUTTER_CHANNEL: stable
  FORK_BRANCH: dev_from_v3.1.4
  ARTIFACT_NAME: pure-live-portable
jobs:
  quality:
    name: Analyze & test
    if: ${{ inputs.run_quality }}
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test --concurrency=12

  windows:
    name: Windows Portable
    # quality 未勾选时为 skipped；被 needs 的 job 被 skip 时，下游必须用
    # always() 才能继续求值条件，否则会被强制 skip。
    if: >-
      ${{
        always() &&
        inputs.do_build &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      }}
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Enable Flutter Windows
        run: flutter config --enable-windows-desktop
      - name: Resolve packages
        run: flutter pub get
      - name: Generate production AppConfig
        run: |
          dart run enven `
            --env-files .env,.env.prod `
            --class-name AppConfig
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $lines = Get-Content pubspec.yaml
          foreach ($line in $lines) {
            if ($line -match '^\s*version:\s*(\S+)') {
              $fullVersion = $matches[1] -replace '[`"''`]', ''
              $displayVersion = $fullVersion.Split('+')[0]
              $artifactVersion = $fullVersion.Replace('+', '-')
              $tag = "v$displayVersion"
              "version=$displayVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "artifact_version=$artifactVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
          }
          Write-Error "Version not found"
      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --no-pub
      - name: Locate Windows release bundle
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "build\windows\x64\runner\Release"
          if (!(Test-Path $bundle -PathType Container)) {
            Write-Error "Windows release bundle not found: $bundle"
          }
          "path=$bundle" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $bundle = "${{ steps.bundle.outputs.path }}"
          $portable = "PureLive-dev-$version-windows-x64-portable.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "pure-live-portable"
          Remove-Item $temporary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          Get-ChildItem $bundle -Force |
            Where-Object { $_.Name -notin @("AppData", "IPTV_CACHE") } |
            Copy-Item -Destination $temporary -Recurse -Force
          if (Test-Path (Join-Path $temporary "AppData")) {
            Remove-Item (Join-Path $temporary "AppData") -Recurse -Force
          }
          if (Test-Path (Join-Path $temporary "IPTV_CACHE")) {
            Remove-Item (Join-Path $temporary "IPTV_CACHE") -Recurse -Force
          }
          Compress-Archive `
            -Path (Join-Path $temporary "*") `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force
          if (!(Test-Path $portable -PathType Leaf)) {
            Write-Error "Windows portable archive was not created."
          }
      - name: Verify portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $portable = "PureLive-dev-$version-windows-x64-portable.zip"
          if (!(Test-Path $portable -PathType Leaf)) {
            Write-Error "Portable package not found: $portable"
          }
          $entries = tar -tf $portable
          if ($entries | Where-Object { $_ -match '(^|/)(AppData|IPTV_CACHE)(/|$)' }) {
            Write-Error "Runtime state was found in the Windows portable package."
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            PureLive-dev-*-windows-x64-portable.zip
          if-no-files-found: error
          # 保留 14 天，供“只发布”模式回取最近一次成功构建的产物。
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: >-
      ${{
        always() &&
        inputs.create_release &&
        (
          (inputs.do_build && needs.windows.result == 'success') ||
          (!inputs.do_build &&
            (needs.quality.result == 'success' || needs.quality.result == 'skipped'))
        )
      }}
    needs:
      - quality
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact_run_id: ${{ steps.artifact_source.outputs.run_id }}
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          display="${full%%+*}"
          artifact="${full/+/-}"
          echo "version=$display" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact" >> "$GITHUB_OUTPUT"
          echo "tag=v$display" >> "$GITHUB_OUTPUT"
      - name: Resolve artifact source run
        id: artifact_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.do_build }}" = "true" ] && \
             [ "${{ needs.windows.result }}" = "success" ]; then
            echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "source=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # “只发布”模式：从本工作流最近的成功运行中找到仍保留的构建产物。
          # 工作流文件名可能被重命名（且可能含 & 等特殊字符），先按工作流
          # 名称解析出实际文件路径，再做 URL 编码，避免硬编码文件名。
          wf_path=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq ".workflows[] | select(.name == \"$WORKFLOW_NAME\") | .path" | head -n1)
          if [ -z "$wf_path" ]; then
            echo "::error::无法按名称解析当前工作流文件：$WORKFLOW_NAME"
            exit 1
          fi
          wf_file="${wf_path##*/}"
          wf_enc="${wf_file//&/%26}"
          echo "当前工作流文件：$wf_file"

          run_id=""
          runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$wf_enc/runs?event=workflow_dispatch&status=success&per_page=20" \
            --jq '.workflow_runs[].id')
          for rid in $runs; do
            match=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts?per_page=100" \
              --jq '[.artifacts[].name] | index(env.ARTIFACT_NAME) // empty')
            if [ -n "$match" ]; then
              run_id=$rid
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "::error::最近成功的运行中没有找到有效产物（可能已过保留期），请先执行一次构建。"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source=previous" >> "$GITHUB_OUTPUT"
          echo "将回取运行 #$run_id 的构建产物。"
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts
          run-id: ${{ steps.artifact_source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Show release artifacts
        shell: bash
        run: find artifacts -type f -print | sort
      - name: Generate BUILD_METADATA.json
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_RUN_ID: ${{ steps.artifact_source.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          artifacts = []
          for path in sorted(Path("artifacts").rglob("*")):
              if path.is_file():
                  artifacts.append({"name": path.name, "path": str(path), "size": path.stat().st_size})
          metadata = {
              "project": "PureLive",
              "repository": os.environ["REPOSITORY"],
              "release_tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["SHA"],
              "ref": os.environ["REF"],
              "workflow": os.environ["WORKFLOW"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_number": int(os.environ["RUN_NUMBER"]),
              "build_run_id": int(os.environ["BUILD_RUN_ID"]),
              "actor": os.environ["ACTOR"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifacts": artifacts,
          }
          Path("BUILD_METADATA.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Build Release Body
        id: release_body
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          desc_path = Path("assets/version_desc.md")

          if not desc_path.is_file():
              raise SystemExit(f"找不到 {desc_path}")

          template = desc_path.read_text(encoding="utf-8").strip()
          if not template:
              raise SystemExit("assets/version_desc.md 为空")

          body = template.replace("{tag}", tag).replace("{repo}", repo)

          body_file = Path("release_body.txt")
          body_file.write_text(body + "\n", encoding="utf-8")
          print(body)
          PY
          echo "body_path=$(pwd)/release_body.txt" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.release_body.outputs.body_path }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          make_latest: ${{ !inputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*
            BUILD_METADATA.json

  update-json:
    name: Sync version.json & releases.json
    if: ${{ always() && inputs.create_release && needs.publish-release.result == 'success' }}
    needs:
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Generate assets/version.json
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          from pathlib import Path

          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          m = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', pubspec, re.MULTILINE)
          if not m:
              raise SystemExit("pubspec.yaml version 格式应为 X.Y.Z+NNN")
          version, build = m.group(1), int(m.group(2))

          desc_path = Path("assets/version_desc.md")
          if not desc_path.is_file():
              raise SystemExit("找不到 assets/version_desc.md")
          raw_desc = desc_path.read_text(encoding="utf-8").strip()
          if not raw_desc:
              raise SystemExit("assets/version_desc.md 为空")

          # version_desc.md 同时是 GitHub Release 页正文（含标题、便携版说明、
          # Build Metadata 等模板内容），但应用内更新弹窗只需要「本次更新」小节。
          marker = re.search(r'^###\s+.*本次更新\s*$', raw_desc, re.MULTILINE)
          changelog = raw_desc[marker.end():].strip() if marker else raw_desc

          # 丢弃小节内手写的 version 行（可能带有 [Pre-release] 等标记），
          # 统一由 pubspec 版本号生成，保持应用内弹窗的历史格式。
          changelog = re.sub(
              r'^version:.*$(?:\r?\n)?', '', changelog, count=1, flags=re.MULTILINE
          ).strip()
          version_desc = f"version: {version} (build {build})"
          if changelog:
              version_desc += f"\n\n{changelog}"

          existing = json.loads(Path("assets/version.json").read_text(encoding="utf-8"))
          prerelease = os.environ.get("PRERELEASE", "false").lower() == "true"
          download_url = existing.get("download_url") or \
              "https://github.com/ZXS20240220/pure_live/releases"

          def ver_num(v, b):
              parts = [int(x) for x in v.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              return parts[0] * 10000000 + parts[1] * 100000 + parts[2] * 1000 + b

          # 先拷贝既有字段，再用本次发布身份覆盖，避免旧值反向覆盖
          # version / build_number；同时保留 platforms 下其它平台节点。
          platforms = dict(existing.get("platforms", {}))
          windows_node = dict(platforms.get("windows", {}))
          windows_node.update({
              "version": version,
              "build_number": build,
              "version_num": ver_num(version, build),
              "version_desc": version_desc,
              "prerelease": prerelease,
              "download_url": download_url,
          })
          platforms["windows"] = windows_node

          # 本次发布的完整版本信息（顶层 + platforms），同时用作 latest_stable 的来源。
          current_release = {
              "version": version,
              "build_number": build,
              "version_num": ver_num(version, build),
              "version_desc": version_desc,
              "prerelease": prerelease,
              "download_url": download_url,
              "platforms": platforms,
          }

          result = dict(current_release)

          def fetch_stable_from_github():
              """从 GitHub API 查找最新稳定版，并拉取其 version.json 作为 latest_stable。"""
              token = os.environ.get("GITHUB_TOKEN", "")
              repo = os.environ.get("GITHUB_REPOSITORY", "ZXS20240220/pure_live")
              headers = {
                  "User-Agent": "PureLive-Release-Feed",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"

              api_url = f"https://api.github.com/repos/{repo}/releases?per_page=30"
              req = urllib.request.Request(api_url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      releases = json.loads(resp.read().decode("utf-8"))
              except (urllib.error.URLError, json.JSONDecodeError) as e:
                  print(f"⚠️ 无法获取 releases 列表，跳过 latest_stable 自动填充: {e}", file=sys.stderr)
                  return None

              stable_tag = None
              for rel in releases:
                  if not rel.get("prerelease", False):
                      stable_tag = rel.get("tag_name")
                      break
              if not stable_tag:
                  print("⚠️ 未找到稳定版 Release，跳过 latest_stable 自动填充", file=sys.stderr)
                  return None

              raw_url = f"https://raw.githubusercontent.com/{repo}/{stable_tag}/assets/version.json"
              raw_req = urllib.request.Request(raw_url, headers={"User-Agent": "PureLive-Release-Feed"})
              try:
                  with urllib.request.urlopen(raw_req, timeout=20) as resp:
                      stable_feed = json.loads(resp.read().decode("utf-8"))
              except (urllib.error.URLError, json.JSONDecodeError) as e:
                  print(f"⚠️ 无法拉取稳定版 version.json ({stable_tag})，跳过 latest_stable: {e}", file=sys.stderr)
                  return None

              if not isinstance(stable_feed, dict):
                  return None
              sv = stable_feed.get("version", "")
              sb = stable_feed.get("build_number")
              if not sv or not sb:
                  return None
              print(f"✓ 从 {stable_tag} 拉取稳定版 {sv}+{sb} 作为 latest_stable")
              return stable_feed

          # latest_stable 维护最新稳定版信息，供客户端 stableOnly 模式使用：
          # - 发布稳定版（prerelease=false）时，latest_stable 更新为本次发布；
          # - 发布预发布版时，优先保留已有 latest_stable；若缺失，则从 GitHub
          #   自动检索最新稳定版 Release 并拉取其 version.json 填充。
          if not prerelease:
              result["latest_stable"] = dict(current_release)
          else:
              existing_stable = existing.get("latest_stable")
              if isinstance(existing_stable, dict) and existing_stable.get("version"):
                  result["latest_stable"] = existing_stable
              else:
                  fetched = fetch_stable_from_github()
                  if fetched is not None:
                      result["latest_stable"] = fetched

          Path("assets/version.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          stable_tag = result.get("latest_stable", {}).get("version", "<none>")
          print(f"version.json generated: {version}+{build}, prerelease={prerelease}, latest_stable={stable_tag}")
          PY
      # 用本 Fork 全量 Release 重建 feed：REST API 相比 gh release view
      # 能补齐 author.avatar，并刷新历史版本的 downloadCount。
      # 脚本固定只查当前仓库（GITHUB_REPOSITORY），不合并上游历史。
      - name: Update assets/releases.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/sync_fork_releases.py
      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/version.json assets/releases.json
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "version.json / releases.json 均无变化，跳过提交。"
            exit 0
          fi
          git commit -m "chore: update release feed for ${{ needs.publish-release.outputs.tag }} [skip ci]"
          git pull --rebase origin ${{ env.FORK_BRANCH }}
          git push origin HEAD:${{ env.FORK_BRANCH }}