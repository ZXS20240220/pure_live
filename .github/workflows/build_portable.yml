# Fork 专用 – 仅构建 Windows 便携版（Portable ZIP）
# 不依赖证书 / Inno Setup / fastforge，零 Secret 配置
name: Build Portable
on:
  workflow_dispatch:
    inputs:
      run_quality:
        description: Run analyze and tests first
        required: true
        type: boolean
        default: false
      create_release:
        description: Create a GitHub Release and update releases.json
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (e.g. v3.1.4) – required if create_release is true
        required: true
        type: string
        default: 'v3.1.4'
      prerelease:
        description: Mark as pre-release
        required: true
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: portable-build-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_CHANNEL: stable
  FORK_BRANCH: dev_from_v3.1.4
jobs:
  quality:
    name: Analyze & test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_quality }}
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test --concurrency=12

  windows:
    name: Windows Portable
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      }}
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Enable Flutter Windows
        run: flutter config --enable-windows-desktop
      - name: Resolve packages
        run: flutter pub get
      - name: Generate production AppConfig
        run: |
          dart run enven `
            --env-files .env,.env.prod `
            --class-name AppConfig
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $lines = Get-Content pubspec.yaml
          foreach ($line in $lines) {
            if ($line -match '^\s*version:\s*(\S+)') {
              $fullVersion = $matches[1] -replace '[`"''`]', ''
              $displayVersion = $fullVersion.Split('+')[0]
              $artifactVersion = $fullVersion.Replace('+', '-')
              "version=$displayVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "artifact_version=$artifactVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
          }
          Write-Error "Version not found"
      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --no-pub
      - name: Locate Windows release bundle
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "build\windows\x64\runner\Release"
          if (!(Test-Path $bundle -PathType Container)) {
            Write-Error "Windows release bundle not found: $bundle"
          }
          "path=$bundle" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $bundle = "${{ steps.bundle.outputs.path }}"
          $portable = "PureLive-$version-windows-x64-portable.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "pure-live-portable"
          Remove-Item $temporary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          Get-ChildItem $bundle -Force |
            Where-Object { $_.Name -notin @("AppData", "IPTV_CACHE") } |
            Copy-Item -Destination $temporary -Recurse -Force
          if (Test-Path (Join-Path $temporary "AppData")) {
            Remove-Item (Join-Path $temporary "AppData") -Recurse -Force
          }
          if (Test-Path (Join-Path $temporary "IPTV_CACHE")) {
            Remove-Item (Join-Path $temporary "IPTV_CACHE") -Recurse -Force
          }
          Compress-Archive `
            -Path (Join-Path $temporary "*") `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force
          if (!(Test-Path $portable -PathType Leaf)) {
            Write-Error "Windows portable archive was not created."
          }
      - name: Verify portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $portable = "PureLive-$version-windows-x64-portable.zip"
          if (!(Test-Path $portable -PathType Leaf)) {
            Write-Error "Portable package not found: $portable"
          }
          $entries = tar -tf $portable
          if ($entries | Where-Object { $_ -match '(^|/)(AppData|IPTV_CACHE)(/|$)' }) {
            Write-Error "Runtime state was found in the Windows portable package."
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-live-portable
          path: |
            PureLive-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish GitHub Release
    if: ${{ always() && inputs.create_release && needs.windows.result == 'success' }}
    needs:
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            echo "release_tag is required when create_release=true."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected: v1.2.3)"
            exit 1
          fi
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show release artifacts
        shell: bash
        run: find artifacts -type f -print | sort
      - name: Generate BUILD_METADATA.json
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 获取 Flutter 版本（从构建 job 的环境变量传递不可用，这里用 tag 占位）
          FLUTTER_VERSION="n/a"
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          artifacts = []
          for path in sorted(Path("artifacts").rglob("*")):
              if path.is_file():
                  artifacts.append({"name": path.name, "path": str(path), "size": path.stat().st_size})
          metadata = {
              "project": "PureLive",
              "repository": os.environ["REPOSITORY"],
              "release_tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["SHA"],
              "ref": os.environ["REF"],
              "workflow": os.environ["WORKFLOW"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_number": int(os.environ["RUN_NUMBER"]),
              "actor": os.environ["ACTOR"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifacts": artifacts,
          }
          Path("BUILD_METADATA.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Build Release Body
        id: release_body
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          version_file = Path("assets/version.json")

          if not version_file.is_file():
              raise SystemExit(f"找不到 {version_file}")

          data = json.loads(version_file.read_text(encoding="utf-8"))
          version_desc = data.get("version_desc")
          if not version_desc or not str(version_desc).strip():
              raise SystemExit("assets/version.json 中的 version_desc 为空")

          version_desc = str(version_desc).strip()

          body = f"""# 纯粹直播 {tag}

          ### 🖥️ Windows 便携版

          - **Portable ZIP**：解压即用，无需安装
          - 适配：Windows 10/11 x64

          ### 🔧 Build Metadata

          [BUILD_METADATA.json](https://github.com/{repo}/releases/download/{tag}/BUILD_METADATA.json)

          ### 📝 本次更新

          {version_desc}
          """.strip()

          body_file = Path("release_body.txt")
          body_file.write_text(body + "\n", encoding="utf-8")
          print(body)
          PY
          echo "body_path=$(pwd)/release_body.txt" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body_path: ${{ steps.release_body.outputs.body_path }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          make_latest: ${{ !inputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*
            BUILD_METADATA.json

  update-json:
    name: Update releases.json
    if: ${{ always() && inputs.create_release && needs.publish-release.result == 'success' }}
    needs:
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Update assets/releases.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          result = subprocess.run(
              ["gh", "release", "view", tag,
               "--json", "tagName,name,url,publishedAt,isDraft,body,author,isPrerelease,assets"],
              check=True, capture_output=True, text=True,
          )
          release = json.loads(result.stdout)
          path = Path("assets/releases.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
          else:
              data = {}
          if isinstance(data, dict) and isinstance(data.get("releases"), list):
              releases = data["releases"]
          elif isinstance(data, list):
              releases = data
              data = {"releases": releases}
          else:
              releases = []
              data = {"releases": releases}
          releases[:] = [item for item in releases
                         if not (isinstance(item, dict) and item.get("tagName") == tag)]
          releases.insert(0, release)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "assets/releases.json has no changes."
            exit 0
          fi
          git add assets/releases.json
          git commit -m "chore: update releases.json for ${{ inputs.release_tag }} [skip ci]"
          git pull --rebase origin ${{ env.FORK_BRANCH }}
          git push origin ${{ env.FORK_BRANCH }}
