name: PureLive Release Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows EXE and MSIX
        required: true
        type: boolean
        default: false

      run_quality:
        description: Run analyze, tests and public interface probes first
        required: true
        type: boolean
        default: false

      create_release:
        description: Create a GitHub Release and update releases.json
        required: true
        type: boolean
        default: false

      release_tag:
        description: Release tag (e.g. v1.0.0) – required if create_release is true
        required: true
        type: string
        default: 'v3.1.4'

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.0

# =========================================================
# QUALITY
# =========================================================

jobs:

  quality:
    name: Analyze, test and probe

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_quality }}

    runs-on: ubuntu-latest

    timeout-minutes: 35

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter SDK
        run: flutter --version

      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile

      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --concurrency=12

      - name: Probe public interfaces
        run: python tool/interface_probe.py


# =========================================================
# WINDOWS
# =========================================================

  windows:
    name: Windows EXE + MSIX

    if: ${{ always() && inputs.build_windows && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    needs: quality

    runs-on: windows-latest

    timeout-minutes: 35

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -----------------------------------------------------
      # MSIX certificate
      # -----------------------------------------------------

      - name: Decode MSIX Certificate
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
        run: |
          $ErrorActionPreference = "Stop"

          $certBase64 = "$env:CERTIFICATE".Trim() -replace '\s+', ''

          if ([string]::IsNullOrEmpty($certBase64)) {
            Write-Error "CERTIFICATE secret is empty!"
          }

          $certBytes = [System.Convert]::FromBase64String($certBase64)

          $certPath = Join-Path `
            -Path (Get-Location) `
            -ChildPath "certificate.pfx"

          [IO.File]::WriteAllBytes($certPath, $certBytes)

          "FINAL_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Update MSIX make_config.yaml
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $configPath = "windows/packaging/msix/make_config.yaml"

          if (!(Test-Path $configPath)) {
            Write-Error "Config file not found: $configPath"
          }

          if ([string]::IsNullOrEmpty($env:CERT_PASSWORD)) {
            Write-Error "CERTIFICATE_PASSWORD secret is empty!"
          }

          $absolutePath = $env:FINAL_CERT_PATH -replace '\\', '/'

          $content = Get-Content $configPath -Raw

          $content = $content -replace `
            'certificate_path:\s*.*',
            "certificate_path: $absolutePath"

          $content = $content -replace `
            '(?m)^(\s*certificate_password:\s*).*$', `
            "`${1}'$($env:CERT_PASSWORD)'"

          Set-Content `
            -Path $configPath `
            -Value $content

      # -----------------------------------------------------
      # Flutter
      # -----------------------------------------------------

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Flutter Windows
        run: flutter config --enable-windows-desktop

      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile

      - name: Generate production AppConfig
        run: |
          dart run enven `
            --env-files .env,.env.prod `
            --class-name AppConfig

      # -----------------------------------------------------
      # Inno Setup
      # -----------------------------------------------------

      - name: Install pinned Windows packagers
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          dart pub global activate fastforge 0.6.0

      - name: Copy Chinese language pack
        shell: pwsh
        run: |
          $source = "windows\packaging\exe\ChineseSimplified.isl"
          $target = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

          if (Test-Path $source) {
            Copy-Item $source $target -Force
          }

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $lines = Get-Content pubspec.yaml

          foreach ($line in $lines) {
            if ($line -match '^\s*version:\s*(\S+)') {
              $v = $matches[1] -replace '[`"''`]', ''
              $artifactVersion = $v -replace '\+', '-'
              $v = $v.Split('+')[0]

              "version=$v" |
                Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

              "artifact_version=$artifactVersion" |
                Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

              exit 0
            }
          }

          Write-Error "Version not found"

      # -----------------------------------------------------
      # Package
      # -----------------------------------------------------

      - name: Package Windows EXE and MSIX
        shell: pwsh
        run: |
          fastforge package `
            --platform windows `
            --targets exe,msix

      # -----------------------------------------------------
      # Rename
      # -----------------------------------------------------

      - name: Rename Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $VERSION = "${{ steps.version.outputs.artifact_version }}"
          $DIST_DIR = "dist"

          $EXE_FILE = Get-ChildItem `
            $DIST_DIR `
            -Recurse `
            -Filter "*.exe" |
            Select-Object -First 1

          if (!$EXE_FILE) {
            Write-Error "Windows EXE package not found."
          }

          Copy-Item `
            $EXE_FILE.FullName `
            "PureLive-$VERSION-windows-x64-setup.exe" `
            -Force

          $MSIX_FILE = Get-ChildItem `
            $DIST_DIR `
            -Recurse `
            -Filter "*.msix" |
            Select-Object -First 1

          if (!$MSIX_FILE) {
            Write-Error "Windows MSIX package not found."
          }

          Copy-Item `
            $MSIX_FILE.FullName `
            "PureLive-$VERSION-windows-x64.msix" `
            -Force

      # -----------------------------------------------------
      # SHA256
      # -----------------------------------------------------

      - name: Generate Windows SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Get-ChildItem -File -Filter "PureLive-*-windows-x64-setup.exe" |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" |
                Set-Content "$($_.FullName).sha256"
            }

          Get-ChildItem -File -Filter "PureLive-*-windows-x64.msix" |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" |
                Set-Content "$($_.FullName).sha256"
            }

      # -----------------------------------------------------
      # Upload
      # -----------------------------------------------------

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-windows
          path: |
            PureLive-*-windows-x64-setup.exe
            PureLive-*-windows-x64-setup.exe.sha256
            PureLive-*-windows-x64.msix
            PureLive-*-windows-x64.msix.sha256
          if-no-files-found: error
          retention-days: 3


# =========================================================
# RELEASE
# =========================================================

  publish-release:
    timeout-minutes: 15
    name: Publish GitHub Release

    if: >-
      ${{ always() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.create_release &&
        inputs.build_windows &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
        needs.windows.result == 'success' }}
    needs:
      - quality
      - windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # -----------------------------------------------------
      # Validate release tag
      # -----------------------------------------------------

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail


          if [[ -z "$TAG" ]]; then
            echo "release_tag is required when create_release=true."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: v1.2.3"
            exit 1
          fi

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      # -----------------------------------------------------
      # Download artifacts
      # -----------------------------------------------------

      - name: Download all build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.1
        with:
          path: artifacts

      # -----------------------------------------------------
      # Show artifacts
      # -----------------------------------------------------

      - name: Show release artifacts
        shell: bash
        run: |
          echo "========================================"
          echo "Release artifacts"
          echo "========================================"

          find artifacts \
            -type f \
            -print |
            sort

      # -----------------------------------------------------
      # Verify SHA256 files
      # -----------------------------------------------------

      - name: Verify SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verifying SHA256 checksums"
          echo "========================================"

          found=0

          while IFS= read -r checksum_file; do
            found=1

            echo ""
            echo "Checking:"
            echo "$checksum_file"

            cd "$(dirname "$checksum_file")"

            sha256sum \
              --check \
              "$(basename "$checksum_file")"

            cd "$GITHUB_WORKSPACE"

          done < <(
            find artifacts \
              -type f \
              -name '*.sha256' \
              -print
          )

          if [[ "$found" -eq 0 ]]; then
            echo "No SHA256 files found."
            exit 1
          fi

          echo ""
          echo "All SHA256 checksums verified."

      # -----------------------------------------------------
      # Read version description
      # -----------------------------------------------------

      - name: Read version description
        id: version
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1
        with:
          path: assets/version.json

      # -----------------------------------------------------
      # Build Release Body
      # -----------------------------------------------------

      - name: Build Release Body
        id: release_body
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_DESCRIPTION: ${{ fromJson(steps.version.outputs.content).version_desc }}
        run: |
          set -euo pipefail

          cat << EOF > release_body.txt

          # 纯粹直播 $RELEASE_TAG

          |版本|下载地址|
          |---|---|
          |Windows版|[pure_live](https://github.com/liuchuancong/pure_live/releases/latest)|

          ### 🖥️ Windows 版

          - **EXE 安装包**：适合所有用户
          - **MSIX 包**：现代应用格式，支持干净卸载
          - 适配：Windows 10/11 x64
          - 提供 SHA256 校验文件

          ### 📝 本次更新

          $RELEASE_DESCRIPTION

          EOF

          echo "body_path=$(pwd)/release_body.txt" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------
      # Create Release
      # -----------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}

          body_path: ${{ steps.release_body.outputs.body_path }}

          prerelease: false
          generate_release_notes: false
          append_body: false
          make_latest: true

          fail_on_unmatched_files: false

          files: |
            artifacts/**/*


# =========================================================
# UPDATE releases.json
# =========================================================

  update-json:
    timeout-minutes: 15
    name: Update releases.json

    if: ${{ always() && inputs.create_release && needs.publish-release.result == 'success' }}

    needs:
      - publish-release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.1.0
        with:
          python-version: "3.10"

      # -----------------------------------------------------
      # Update releases.json
      # -----------------------------------------------------

      - name: Update assets/releases.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]

          print(f"Updating releases.json for {tag}")

          result = subprocess.run(
              [
                  "gh",
                  "release",
                  "view",
                  tag,
                  "--json",
                  "tagName,name,url,publishedAt,isDraft,isPrerelease,assets"
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          release = json.loads(result.stdout)

          path = Path("assets/releases.json")

          if path.exists():
              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except json.JSONDecodeError:
                  print("Existing releases.json is invalid JSON.")
                  raise
          else:
              data = {}

          if (
              isinstance(data, dict)
              and isinstance(data.get("releases"), list)
          ):
              releases = data["releases"]

          elif isinstance(data, list):
              releases = data

              data = {
                  "releases": releases
              }

          else:
              releases = []

              data = {
                  "releases": releases
              }

          # Remove old entry with same tag.
          releases[:] = [
              item
              for item in releases
              if not (
                  isinstance(item, dict)
                  and item.get("tagName") == tag
              )
          ]

          # Insert newest release at the beginning.
          releases.insert(0, release)

          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(f"Updated {path}")
          PY

      # -----------------------------------------------------
      # Commit
      # -----------------------------------------------------

      - name: Commit and Push releases.json
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain -- assets/releases.json)" ]]; then
            echo "assets/releases.json has no changes."
            exit 0
          fi

          git add assets/releases.json

          git commit \
            -m "chore: update releases.json for $RELEASE_TAG [skip ci]"

          git pull \
            --rebase \
            origin master

          git push \
            origin master
